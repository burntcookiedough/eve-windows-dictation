[project]
name = "murmur"
version = "0.6.0"
description = "WebSocket-based live voice transcription server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
nemotron = [
    "nemo_toolkit[asr]>=2.2.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "python-dateutil>=2.9.0.post0",
]
all = ["murmur[whisper,nemotron]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.0",
]
ui = [
    "PySide6>=6.6.0",
    "sounddevice>=0.4.6",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/audio",
    "src/protocol",
    "src/session",
    "src/transcription",
    "src/websocket",
]
include = ["src/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require running server)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "websockets>=16.0",
    "murmur-testui",
]

ui = [
    "PySide6>=6.6.0",
    "sounddevice>=0.5.1",
    "websockets>=16.0",
]

# PyTorch CUDA index — only for torch packages, everything else from PyPI
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
murmur-testui = { path = "tests/ui", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[project.scripts]
murmur = "main:main"
