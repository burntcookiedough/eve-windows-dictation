<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isolated Test Editor Observer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #121212; color: #eee; }
    textarea { width: 100%; height: 120px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 14px; }
    .status { margin-top: 10px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h3>Isolated Performance Test Editor (Explicit Test Observer)</h3>
  <p class="status">Explicit manual/harness observer only. Never inspects daily user clipboard or external windows.</p>
  <textarea id="isolated-editor" data-testid="isolated-editor" placeholder="Paste test targets here under test harness..."></textarea>
  <div id="observation-result" class="status">Awaiting input event...</div>
  <script type="module" src="./isolated-editor-observer.ts"></script>
</body>
</html>
