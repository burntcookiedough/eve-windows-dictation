[project]
name = "whisper-benchmark"
version = "0.1.0"
description = "Faster-whisper benchmark for comparison with Nemotron Speech"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
