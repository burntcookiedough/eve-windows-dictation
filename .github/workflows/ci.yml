name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: python scripts/version.py check

  app-build:
    name: App Test And Build
    runs-on: windows-latest
    needs: version-consistency
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run app tests
        run: bun test

      - name: Run Insights database migration test
        run: bun run test:history

      - name: Build app
        run: bun run build

  server-tests:
    name: Server Tests
    runs-on: windows-latest
    needs: version-consistency
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install server test dependencies
        working-directory: server
        run: uv sync --extra whisper --group dev --frozen

      - name: Run server tests
        working-directory: server
        run: uv run --no-sync pytest
