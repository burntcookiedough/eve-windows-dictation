name: Windows Retained History Acceptance Gate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Required 40-character lowercase harness commit SHA to test on trunk'
        required: true
        type: string
      candidate_source:
        description: 'Artifact from a successful lifecycle run, or the pinned published release'
        required: true
        type: choice
        options:
          - retained
          - published
      candidate_id:
        description: 'Numeric Actions artifact ID (retained) or GitHub release ID (published)'
        required: true
        type: string
      candidate_commit:
        description: 'Required 40-character lowercase commit SHA of the candidate build'
        required: true
        type: string
      candidate_tag:
        description: 'Exact version tag of the candidate, including the leading v'
        required: true
        type: string
      expected_manifest_sha256:
        description: 'Independently verified lowercase SHA-256 of the release artifact manifest'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: eve-retained-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retained-history:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout harness source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require trunk manual dispatch context and exact harness commit
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:OS -ne 'Windows_NT') {
            throw 'Retained History gate requires a disposable GitHub-hosted Windows runner.'
          }
          if ($env:GITHUB_REPOSITORY -cne 'burntcookiedough/eve-windows-dictation') { throw 'Unexpected repository.' }
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'Retained History gate is manual-only (workflow_dispatch).'
          }
          if ($env:GITHUB_REF -ne 'refs/heads/trunk') {
            throw "Retained History gate is restricted to trunk, observed ref: $env:GITHUB_REF"
          }
          if (-not $env:EXPECTED_COMMIT -or $env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'workflow_dispatch requires expected_commit as a 40-character lowercase SHA.'
          }
          $gitHead = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_COMMIT -ne $env:GITHUB_SHA -or $env:EXPECTED_COMMIT -ne $gitHead) {
            throw 'expected_commit does not match the workflow event SHA or git HEAD.'
          }

          node -e "if(typeof WebSocket!=='function')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Hosted Node lacks built-in WebSocket.' }
          python -B -I -c "import sqlite3,sys; assert sys.version_info >= (3,9)"
          if ($LASTEXITCODE -ne 0) { throw 'Hosted Python/SQLite is unavailable.' }

      - name: Verify selected candidate and run isolated History acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $retainedDir = Join-Path $env:RUNNER_TEMP "eve-retained-candidate-artifacts-$env:GITHUB_RUN_ID"
          . ./scripts/retained-history-ci.ps1
          $candidate = Save-RetainedHistoryCandidate -RetainedDir $retainedDir -Source $env:CANDIDATE_SOURCE `
            -CandidateId $env:CANDIDATE_ID -CandidateCommit $env:CANDIDATE_COMMIT -CandidateTag $env:CANDIDATE_TAG `
            -ExpectedManifestSha256 $env:EXPECTED_MANIFEST_SHA256
          ./scripts/installer-lifecycle-ci.ps1 -Mode RetainedHistory -RetainedArtifactDir $retainedDir -ExpectedCommit $env:EXPECTED_COMMIT -HistoryCandidate $candidate

      - name: Upload explicit aggregate JSON evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eve-retained-history-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/eve-alpha7-installer-lifecycle-${{ github.run_id }}/evidence/functional-history-evidence.json
          retention-days: 7
          if-no-files-found: warn
