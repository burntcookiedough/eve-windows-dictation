name: Windows Simulated Acceptance

on:
  pull_request:
    branches: [trunk]
    types: [opened, synchronize, reopened, labeled]
    paths: ['.github/workflows/simulated-acceptance.yml', 'scripts/sim_acceptance/**']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Verified installer lifecycle run ID
        required: true
        type: string
      artifact_id:
        description: Retained candidate Actions artifact ID
        required: true
        type: string
      candidate_commit:
        description: Full retained candidate commit
        required: true
        type: string
      manifest_sha256:
        description: Independently verified artifact manifest SHA-256
        required: true
        type: string
      smoke_only:
        description: Smoke close/quiet against the verified candidate
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: eve-simulated-acceptance-${{ github.sha }}
  cancel-in-progress: false

env:
  SMOKE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_only || github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sim-full') }}

jobs:
  acceptance:
    name: Simulated CPU (${{ matrix.config }})
    if: >-
      github.repository == 'burntcookiedough/eve-windows-dictation' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'sim-full')))
    runs-on: windows-2022
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.smoke_only || github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sim-full')) && '["close-quiet"]' || '["far-quiet","far-moderate","close-moderate","close-quiet"]') }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QA Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Verify and install retained candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '45784796424' }}
          ARTIFACT_ID: ${{ inputs.artifact_id || '15101085356' }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit || '22aa01d70a10fc8b52668866ff1c0bd5ac02c751' }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 || 'e0004b05ee119467a037c201ea723159e01adda3615f5a2668cfb05433fe763f' }}
        run: |
          $pins = @{
            RunId = $env:CANDIDATE_RUN_ID
            ArtifactId = $env:ARTIFACT_ID
            Commit = $env:CANDIDATE_COMMIT
            ManifestSha256 = $env:MANIFEST_SHA256
          }
          ./scripts/sim_acceptance/install.ps1 @pins
          $identity = @{
            run_id = $pins.RunId
            artifact_id = $pins.ArtifactId
            commit = $pins.Commit
            manifest_sha256 = $pins.ManifestSha256
          } | ConvertTo-Json -Compress
          "identity=$identity" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Prepare public corpus
        shell: pwsh
        env:
          QA_ROOT: ${{ steps.candidate.outputs.root }}
          CONFIG: ${{ matrix.config }}
        run: |
          python -m pip install --disable-pip-version-check -r scripts/sim_acceptance/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arguments = @('scripts/sim_acceptance/prepare_corpus.py', '--root', "$env:QA_ROOT/corpus", '--config', $env:CONFIG)
          if ($env:SMOKE_ONLY -eq 'true') { $arguments += '--smoke' }
          python @arguments

      - name: Run isolated acceptance
        shell: pwsh
        env:
          QA_ROOT: ${{ steps.candidate.outputs.root }}
          INSTALL: ${{ steps.candidate.outputs.install }}
          VERIFIED_CANDIDATE: ${{ steps.candidate.outputs.identity }}
          CONFIG: ${{ matrix.config }}
        run: |
          $arguments = @(
            'scripts/sim_acceptance/hosted.py', '--root', $env:QA_ROOT, '--install', $env:INSTALL,
            '--candidate', $env:VERIFIED_CANDIDATE,
            '--manifest', "$env:QA_ROOT/corpus/manifest.json", '--config', $env:CONFIG,
            '--output', "$env:QA_ROOT/evidence.json", '--entity-audit', "$env:QA_ROOT/entity-audit.json"
          )
          if ($env:SMOKE_ONLY -eq 'true') { $arguments += '--smoke' }
          python @arguments

      - name: Upload sanitized observations
        if: always() && steps.candidate.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eve-sim-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.config }}
          path: |
            ${{ steps.candidate.outputs.root }}/evidence.json
            ${{ steps.candidate.outputs.root }}/entity-audit.json
          retention-days: 7
          if-no-files-found: warn
